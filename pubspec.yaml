name: gradeapp
description: "GradeApp — школа в телефоне для ученика, родителя и учителя."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  camera: ^0.12.0+2
  dio: ^5.11.1
  file_picker: ^13.4.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2960.0
  path_provider: ^2.1.6
  sentry_flutter: ^8.14.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Onest (SIL OFL 1.1, assets/fonts/OFL.txt): static instances of the
    # variable font, one file per weight used by the type scale.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  image_path: assets/brand/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
