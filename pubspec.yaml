name: gradeapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^17.5.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/brand/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
